[project]
name = "caiv"
version = "0.1.0"
description = "AI Resume Builder API"
readme = "README.md"
dependencies = [
    "alembic>=1.16.4",
    "asyncpg>=0.30.0",
    "bcrypt==4.0.1",
    "celery>=5.3.0",
    "fastapi[standard]>=0.116.1",
    "groq>=0.9.0",
    "httpx>=0.28.1",
    "liteparse",
    "passlib[bcrypt]==1.7.4",
    "pgvector>=0.3.0",
    "psycopg2-binary",
    "pydantic-settings>=2.11.0",
    "pydantic[email]>=2.11.7",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.1.1",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.42",
]


requires-python = ">=3.12,<3.13"

[dependency-groups]
dev = [
    "aiosqlite",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
]

[project.optional-dependencies]
worker = [
    "sentence-transformers>=2.5.0",
    "torch>=2.3.1",
]
